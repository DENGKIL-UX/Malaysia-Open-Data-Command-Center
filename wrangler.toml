# =============================================================================
# Malaysia Open Data Command Center — Cloudflare Workers Configuration
# =============================================================================
# Uses @opennextjs/cloudflare adapter for Next.js → Cloudflare Workers
# Build:      npx opennextjs-cloudflare build
# Preview:    npx wrangler dev
# Deploy:     npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
# =============================================================================

name = "malaysia-open-data-command-center"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# OpenNext for Cloudflare output
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference service binding for caching
# see https://opennext.js.org/cloudflare/caching
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "malaysia-open-data-command-center"

# -----------------------------------------------------------------------------
# Smart Placement — routes workers to the optimal location for latency
# -----------------------------------------------------------------------------
[placement]
mode = "smart"

# -----------------------------------------------------------------------------
# Environment Variables (production)
# Secrets (API keys, tokens) should be set via: wrangler secret put <KEY>
# Non-secret values can go here.
# -----------------------------------------------------------------------------
[vars]
NODE_VERSION = "22"

# -----------------------------------------------------------------------------
# Staging / Preview environment
# -----------------------------------------------------------------------------
[env.preview]
name = "malaysia-open-data-command-center-preview"
