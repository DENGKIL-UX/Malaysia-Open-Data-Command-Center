# =============================================================================
# Malaysia Open Data Command Center — Cloudflare Pages Configuration
# =============================================================================
# Deploy with: bun run pages:deploy
# Preview with: bun run pages:preview
# =============================================================================

name = "malaysia-open-data-command-center"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# -----------------------------------------------------------------------------
# Smart Placement — routes workers to the optimal location for latency
# -----------------------------------------------------------------------------
[placement]
mode = "smart"

# -----------------------------------------------------------------------------
# Environment Variables (production)
# Secrets (API keys, tokens) should be set via: wrangler pages secret put <KEY>
# Non-secret values can go here.
# -----------------------------------------------------------------------------
[vars]
NODE_VERSION = "22"

# -----------------------------------------------------------------------------
# Staging / Preview environment
# -----------------------------------------------------------------------------
[env.preview]
name = "malaysia-open-data-command-center-preview"

# -----------------------------------------------------------------------------
# KV Namespace bindings (uncomment when ready to use for caching GeoJSON)
# -----------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "GEOJSON_CACHE"
# id = "<your-kv-namespace-id>"

# -----------------------------------------------------------------------------
# R2 bucket bindings (uncomment for large dataset storage)
# -----------------------------------------------------------------------------
# [[r2_buckets]]
# binding = "DATA_BUCKET"
# bucket_name = "malaysia-open-data"

# -----------------------------------------------------------------------------
# D1 Database bindings (uncomment for serverless SQL)
# -----------------------------------------------------------------------------
# [[d1_databases]]
# binding = "DB"
# database_name = "malaysia-open-data-db"
# database_id = "<your-d1-database-id>"
